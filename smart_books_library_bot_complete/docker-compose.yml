services:
  app:
    build: .
    container_name: smart_books_app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build: .
    container_name: smart_books_bot
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: python -m bot.main

  postgres:
    image: postgres:16-alpine
    container_name: smart_books_postgres
    environment:
      POSTGRES_DB: smart_books
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart_books_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
